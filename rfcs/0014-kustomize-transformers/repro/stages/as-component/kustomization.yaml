# Pack attached as a component. `patches` stands in for Flux spec.patches, which
# kustomize-controller injects into this root kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../app
components:
  - ./pack
patches:
  - target:
      kind: Deployment
      name: storefront
    patch: |-
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: sidecar
          image: ghcr.io/example/mesh-proxy:0.9.1
